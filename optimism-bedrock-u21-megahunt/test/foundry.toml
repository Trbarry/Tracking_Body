# F6 historical harness — self-contained Foundry project (forge-std only).
# All forks are created from the local read-only archive proxies; nothing is ever broadcast.
[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.25"
evm_version = "osaka"                      # mainnet rules at the U21 pin; see README "EVM version"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]
gas_limit = "18446744073709551615"         # upgrade replays use up to 30M gas per transaction
memory_limit = 1073741824
fs_permissions = [
  { access = "read-write", path = "./" },
  { access = "read-write", path = "../evidence" },
]

[fuzz]
runs = 32

[invariant]
runs = 8
depth = 20

[rpc_endpoints]
l1arch = "http://127.0.0.1:7545"   # Ethereum mainnet archive (any block), read-only failover proxy
l2arch = "http://127.0.0.1:7546"   # OP Mainnet archive (any block)
l1 = "http://127.0.0.1:8545"       # Ethereum mainnet pinned @ 26433900 (post-U21)
l1pre = "http://127.0.0.1:8546"    # Ethereum mainnet pinned @ 26430858 (block before U21)
l1n = "http://127.0.0.1:8547"      # Ethereum mainnet pinned @ 26430859 (U21 block)
l2 = "http://127.0.0.1:9545"       # OP Mainnet pinned @ 159654093
