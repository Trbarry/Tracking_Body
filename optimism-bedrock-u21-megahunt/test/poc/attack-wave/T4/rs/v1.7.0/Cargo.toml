kona-genesis = { path = "/home/user/u21-work/T4/src-v1.7.0/rust/kona/crates/protocol/genesis", default-features = false, features = ["std"] }
kona-registry = { path = "/home/user/u21-work/T4/src-v1.7.0/rust/kona/crates/protocol/registry", default-features = false }
kona-interop = { path = "/home/user/u21-work/T4/src-v1.7.0/rust/kona/crates/protocol/interop", default-features = false, features = ["std"] }
kona-derive = { path = "/home/user/u21-work/T4/src-v1.7.0/rust/kona/crates/protocol/derive", default-features = false, features = ["test-utils"] }
op-alloy-consensus = { path = "/home/user/u21-work/T4/src-v1.7.0/rust/op-alloy/crates/consensus", default-features = false, features = ["std", "k256", "serde"] }
kona-mpt = { path = "/home/user/u21-work/T4/src-v1.7.0/rust/kona/crates/proof/mpt", default-features = false }
