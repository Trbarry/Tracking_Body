[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.25"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read-write", path = "./" }]

[rpc_endpoints]
l1 = "http://127.0.0.1:7545"      # read-only archive proxy; tests pin L1 block 26433900
